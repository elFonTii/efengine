# Workflow de CMake para una sola plataforma (Linux).
#
# Dos responsabilidades, separadas en dos jobs:
#   - build:   compila el motor en CADA push (cualquier rama) y en disparos
#              manuales. Es el CI: atrapa fallos de compilación antes de que
#              lleguen a master (justo lo que antes se colaba post-merge).
#   - release: publica un tag + artefacto en GitHub, solo cuando un PR se
#              mergea a master (necesita los datos del PR para el tag y notas).
#   - readme:  al abrir o reabrir un PR a master, le pide a Claude que actualice
#              el README y propone el cambio en un PR aparte contra esa rama.
#   - docs-check: en el PR verifica que Doxygen sigue generando.
#   - pages:   en cada push a master publica el sitio (landing + Doxygen).
name: CMake on a single platform

on:
  # CI: compila en cada push a cualquier rama.
  push:
    branches:
      - '**'
  # Eventos de PR hacia master. Cada job filtra el que le toca:
  #   opened/reopened -> readme (no en cada push: no quemamos tokens)
  #   + synchronize    -> docs-check (Doxygen tiene que seguir generando)
  #   closed           -> release, y solo si realmente se mergeó.
  # 'pages' NO cuelga de acá: ver el job.
  pull_request:
    types: [opened, reopened, synchronize, closed]
    branches:
      - master
  # Permite lanzar el build a mano desde la pestaña Actions.
  workflow_dispatch:

# Tipo de build de CMake. Release para optimizar el binario que se publica.
env:
  BUILD_TYPE: Release

# Si llega un push más nuevo de la misma rama, cancela el build en curso para
# no gastar minutos de runner en commits ya superados. El release corre sobre
# otra ref (refs/pull/...), así que nunca queda en el mismo grupo: no se cancela.
# En master NO cancelamos: ahí vive el deploy de Pages y cortarlo a la mitad
# dejaría el sitio a medio subir.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    name: Compilar (${{ matrix.build_type }})
    # Solo en push (cualquier rama) o disparo manual. Del evento de PR mergeado
    # se encarga el job 'release'.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Debug queda para destapar bugs que solo aparecen con _DEBUG activo
        # (p.ej. asserts que en Release se compilan afuera).
        build_type: [Debug, Release]

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # Dependencias de sistema que necesita GLFW para compilar en Linux
      # (servidores X11/Wayland y OpenGL).
      - name: Instalar dependencias de GLFW
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xorg-dev \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libgl1-mesa-dev \
            ninja-build

      - name: Configurar CMake
        run: >
          cmake -B ${{ github.workspace }}/build
          -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Compilar
        run: cmake --build ${{ github.workspace }}/build --config ${{ matrix.build_type }}

      - name: Ejecutar tests
        working-directory: ${{ github.workspace }}/build
        run: ctest --output-on-failure --build-config ${{ matrix.build_type }}

  release:
    name: Publicar release
    # Solo cuando un PR fue realmente mergeado a master.
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar dependencias de GLFW
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xorg-dev \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libgl1-mesa-dev \
            ninja-build

      - name: Configurar CMake
        # Desactivamos los tests para el artefacto de release.
        run: >
          cmake -B ${{ github.workspace }}/build
          -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DEFENGINE_BUILD_TESTS=OFF

      - name: Compilar
        run: cmake --build ${{ github.workspace }}/build --config ${{ env.BUILD_TYPE }}

      # Calcula la versión del proyecto leída de CMakeLists.txt y construye un
      # tag único combinándola con el número del PR mergeado.
      - name: Calcular versión y tag
        id: version
        run: |
          PROJECT_VERSION=$(grep -oP 'project\(efengine VERSION \K[0-9]+\.[0-9]+(\.[0-9]+)?' CMakeLists.txt)
          TAG="v${PROJECT_VERSION}-pr.${{ github.event.pull_request.number }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "project_version=${PROJECT_VERSION}" >> "$GITHUB_OUTPUT"

      # Empaqueta el ejecutable sandbox junto a sus assets en un .tar.gz.
      - name: Empaquetar artefacto
        run: |
          PKG="efengine-${{ steps.version.outputs.tag }}-linux-x86_64"
          mkdir -p "dist/${PKG}"
          cp build/bin/sandbox "dist/${PKG}/"
          cp -r assets "dist/${PKG}/assets"
          tar -czf "dist/${PKG}.tar.gz" -C dist "${PKG}"
          echo "Artefacto generado: dist/${PKG}.tar.gz"

      - name: Crear release de GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            dist/*.tar.gz \
            --target "${{ github.sha }}" \
            --title "efengine ${{ steps.version.outputs.tag }}" \
            --notes "Release generada automáticamente al mergear el PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"

  readme:
    name: Proponer README actualizado
    # Al abrir o reabrir el PR. En cada push no se vuelve a llamar al modelo.
    # workflow_dispatch corre el mismo camino SIN llamar a Claude: sirve para
    # probar la plomería de git/gh sin gastar un solo token.
    if: >-
      (github.event_name == 'pull_request' &&
       (github.event.action == 'opened' || github.event.action == 'reopened')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # La action pide un token OIDC a GitHub para autenticarse. Sin esto falla
      # con "Unable to get ACTIONS_ID_TOKEN_REQUEST_URL env variable".
      id-token: write

    steps:
      - name: Checkout de la rama
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      # El diff contra master es el único contexto de "qué cambió". Lo acotamos
      # al código y al build: los assets binarios no dicen nada del README.
      - name: Extraer el diff del PR
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin master
          git diff origin/master...HEAD -- \
            src sandbox tests cmake CMakeLists.txt > pr-diff.txt
          echo "Diff de $(wc -l < pr-diff.txt) líneas."

      # Pineada al SHA y no al tag 'v1': es una action de terceros y este paso
      # ve ANTHROPIC_API_KEY con permiso de escritura sobre el repo.
      - name: Pedirle a Claude el README actualizado
        if: github.event_name == 'pull_request'
        uses: anthropics/claude-code-action@a21f96aeaac393a19ee8b8dff2dce4b840f5d311 # v1 al 2026-09-18
        env:
          ANTHROPIC_MODEL: claude-sonnet-5
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Una flag por línea: es el formato que documenta la action. En una
          # sola línea con comillas anidadas el --model no se aplicaba y caía
          # al modelo por defecto (Opus). ANTHROPIC_MODEL va de refuerzo.
          claude_args: |
            --model claude-sonnet-5
            --allowedTools Read,Edit,Glob,Grep
          prompt: |
            Leé pr-diff.txt: es el diff de este PR contra master en un motor
            gráfico C++17/OpenGL. Leé README.md y actualizá SOLO las partes que
            el diff dejó desfasadas: el árbol de "Estructura del proyecto", la
            lista de subsistemas y las dependencias.

            Reglas:
            - Editá README.md en el working tree. No corras git ni gh.
            - No reescribas secciones que el diff no toca. No cambies el tono
              ni la bitácora de capturas con fechas.
            - El README está en español; escribí en español, con acentos.
            - Si el diff no justifica ningún cambio, no edites nada.

      # Prueba de humo: marca el README para ejercitar el resto del job sin
      # pagarle a nadie. Solo en disparos manuales.
      - name: Simular un cambio (solo workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "" >> README.md
          echo "<!-- prueba de plomeria del job readme -->" >> README.md

      # Si el modelo no tocó el README, el job termina acá sin abrir ruido.
      - name: ¿Hubo cambios?
        id: diff
        run: |
          rm -f pr-diff.txt
          if git diff --quiet -- README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No hay cambios en el README."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Todo por la API REST, que se autentica con GH_TOKEN. Antes esto era un
      # 'git push' y moría con "Invalid username or token": claude-code-action
      # deja la config de credenciales de git inservible, y pelear contra eso
      # falló tres veces. La API no usa esa config para nada.
      - name: Abrir PR con la propuesta
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.event.pull_request.head.ref || github.ref_name }}
          PR_NUM: ${{ github.event.pull_request.number || 'manual' }}
        run: |
          set -euo pipefail
          BRANCH="docs/readme-pr-${PR_NUM}"
          REPO="${GITHUB_REPOSITORY}"
          HEAD_SHA="$(git rev-parse HEAD)"

          # La rama de propuesta arranca donde está la rama base. Si quedó de un
          # intento anterior, la movemos ahí a la fuerza.
          gh api "repos/${REPO}/git/refs" \
            -f ref="refs/heads/${BRANCH}" -f sha="${HEAD_SHA}" >/dev/null 2>&1 \
            || gh api -X PATCH "repos/${REPO}/git/refs/heads/${BRANCH}" \
                 -f sha="${HEAD_SHA}" -F force=true >/dev/null

          # Para pisar un archivo por API hay que mandar el sha del blob actual.
          FILE_SHA="$(gh api "repos/${REPO}/contents/README.md?ref=${BRANCH}" --jq .sha)"
          gh api -X PUT "repos/${REPO}/contents/README.md" \
            -f message="README - actualizacion propuesta para el PR #${PR_NUM}" \
            -f content="$(base64 -w0 README.md)" \
            -f branch="${BRANCH}" \
            -f sha="${FILE_SHA}" >/dev/null
          echo "README subido a ${BRANCH}."

          gh pr create \
            --base "$BASE" \
            --head "$BRANCH" \
            --title "README actualizado para el PR #${PR_NUM}" \
            --body "Propuesta automática. Mergealo si te sirve, cerralo si no." \
            || echo "Ya existía un PR abierto para $BRANCH; se actualizó la rama."

  docs-check:
    name: Verificar que Doxygen genera
    # En el PR abierto no publicamos nada, pero queremos enterarnos acá si la
    # doc dejó de generar, no después del merge.
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Doxygen y dependencias de configure
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            doxygen graphviz \
            xorg-dev \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libgl1-mesa-dev \
            ninja-build

      # Solo configure: el target 'docs' no compila el motor.
      - name: Configurar CMake
        run: >
          cmake -B ${{ github.workspace }}/build
          -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DEFENGINE_BUILD_TESTS=OFF

      - name: Generar documentación
        run: cmake --build ${{ github.workspace }}/build --target docs

  pages:
    name: Publicar documentación en GitHub Pages
    # Cuelga del PUSH a master, no del PR mergeado. En el evento de PR el ref es
    # refs/pull/N/merge, y el environment 'github-pages' solo deja desplegar
    # desde la rama default: rechazaba el deploy con "not allowed to deploy to
    # github-pages due to environment protection rules". El merge de un PR
    # produce un push a master, así que esto cubre el mismo caso con el ref
    # correcto (y también un push directo a master).
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Pages no tolera despliegues concurrentes, y a diferencia del build NO
    # queremos cancelar uno a mitad de camino: quedaría el sitio a medio subir.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Doxygen y dependencias de configure
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            doxygen graphviz \
            xorg-dev \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libgl1-mesa-dev \
            ninja-build

      - name: Configurar CMake
        run: >
          cmake -B ${{ github.workspace }}/build
          -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DEFENGINE_BUILD_TESTS=OFF

      # Sale en docs/html/ (ver CMakeLists.txt, target 'docs').
      - name: Generar documentación
        run: cmake --build ${{ github.workspace }}/build --target docs

      # El sitio tiene dos piezas: la landing del repo en la raíz y la API de
      # Doxygen bajo /docs/.
      - name: Armar el sitio
        run: |
          mkdir -p _site/docs
          cp -r docs/html/. _site/docs/
          if [ -f docs/index.html ]; then
            cp docs/index.html _site/index.html
          else
            # Todavía no se mergeó la landing: la raíz redirige a la API para
            # que el sitio no quede en 404.
            echo '<!DOCTYPE html><meta http-equiv="refresh" content="0; url=docs/">' \
              > _site/index.html
          fi

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir el artefacto del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Desplegar
        id: deploy
        uses: actions/deploy-pages@v4
